name: build

# Every push and pull request: build the plugin with Zig 0.15.2, run the
# offline tests and keep the mod folder (mods/OpenBox Achievements) as a
# workflow artifact. A pushed tag v* (e.g. v1.0.0) also publishes a GitHub
# release with that folder zipped.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  ZIG_VERSION: 0.15.2
  # SHA-256 of the official zig-x86_64-windows-0.15.2.zip.
  ZIG_SHA256: 3A0ED1E8799A2F8CE2A6E6290A9FF22E6906F8227865911FB7DDEDC3CC14CB0C

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get Zig ${{ env.ZIG_VERSION }}
        shell: pwsh
        run: |
          $name = "zig-x86_64-windows-$env:ZIG_VERSION"
          Invoke-WebRequest "https://ziglang.org/download/$env:ZIG_VERSION/$name.zip" -OutFile zig.zip
          if ((Get-FileHash zig.zip -Algorithm SHA256).Hash -ne $env:ZIG_SHA256) { throw 'Zig download hash mismatch' }
          Expand-Archive zig.zip $env:RUNNER_TEMP
          "ZIG=$env:RUNNER_TEMP\$name\zig.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and test
        shell: pwsh
        run: python build.py --zig $env:ZIG --output out --test
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBox-Achievements-mod
          path: out/mods/
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenBox-Achievements-mod
          path: mods
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          zip -r "FH2-ExtraOptions-OpenBox-Achievements-${TAG#v}.zip" mods
          gh release create "$TAG" "FH2-ExtraOptions-OpenBox-Achievements-${TAG#v}.zip" \
            --repo "$GITHUB_REPOSITORY" --title "OpenBox Achievements for FH2 Extra Options ${TAG#v}" --generate-notes
